<script>
'use strict';
const weekdays=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
let state={services:[],clients:[],appointments:[],blocks:[],availability:weekdays.map((day,i)=>({day,enabled:i>=1&&i<=5,start:'09:00',end:'18:00'})),interval:30,settings:{studioName:'Taiany Trindade',title:'Nail Designer',phone:'',advanceDays:60,minNotice:2,cancelPolicy:'',welcomeMessage:'Olá! Seja bem-vinda ao studio Taiany Trindade. 💅'}};
let kanbanData = {}; // { '2026-05-14': {cidade:'Severínia', start:'09:00', end:'18:00'} }

function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function serviceById(id){return state.services.find(s=>s.id==id);}
function statusLabel(s){return({confirmed:'Confirmado',pending:'Pendente',cancelled:'Cancelado',completed:'Concluído',confirmado:'Confirmado',pendente:'Pendente',cancelado:'Cancelado',concluido:'Concluído'})[s]||s;}

async function api(path,opts={}){
  const res=await fetch(path,{headers:{'Content-Type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  const json=await res.json().catch(()=>({}));
  if(!res.ok||json.ok===false) throw new Error(json.error||'Erro no servidor');
  return json.data!==undefined?json.data:json;
}

async function loadFromServer(){
  try{
    const [servicos,clientes,agenda,bloqueios,disponibilidade]=await Promise.all([
      api('/api/admin/servicos'),
      api('/api/admin/clientes'),
      api('/api/admin/agendamentos'),
      api('/api/admin/bloqueios'),
      api('/api/admin/disponibilidade')
    ]);
    state.services=(servicos||[]).map(s=>({id:s.id,name:s.nome,category:s.categoria||'Outro',price:Number(s.preco),duration:Number(s.duracao_minutos||s.duracao||60),description:s.descricao||'',active:s.ativo!==false}));
    state.clients=(clientes||[]).map(c=>({id:c.id,name:c.nome,phone:c.telefone,email:c.email||'',birthday:c.data_nascimento||'',notes:c.observacoes||'',createdAt:c.created_at}));
    state.appointments=(agenda||[]).map(a=>({id:a.id,client:a.nome_cliente,phone:a.telefone_cliente,serviceId:a.servico_id,date:a.data,time:(a.hora_inicio||'').slice(0,5),duration:(()=>{try{const si=a.hora_inicio.split(':').map(Number);const sf=a.hora_fim.split(':').map(Number);return (sf[0]*60+sf[1])-(si[0]*60+si[1]);}catch{return 60}})(),price:Number(a.preco),status:({pendente:'pending',confirmado:'confirmed',concluido:'completed',cancelado:'cancelled'}[String(a.status).toLowerCase()]||a.status||'pending'),notes:a.observacoes||''}));
    state.blocks=(bloqueios||[]).map(b=>({id:b.id,date:b.data,start:b.hora_inicio.slice(0,5),end:b.hora_fim.slice(0,5),reason:b.motivo}));
    
    // NOVO: carrega kanban por data específica
    kanbanData={};
    if(disponibilidade&&disponibilidade.length){
      disponibilidade.forEach(d=>{
        const iso = d.data_especifica ? d.data_especifica.slice(0,10) : null;
        if(iso){
          kanbanData[iso]={cidade:d.cidade||'', start:d.hora_inicio.slice(0,5), end:d.hora_fim.slice(0,5), id:d.id};
        }
      });
    }
    renderAll();
  }catch(e){ console.error(e); alert('Erro ao carregar do Supabase: '+e.message); }
}

function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));document.querySelectorAll('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));renderAll();}
document.querySelectorAll('.nav-button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));

function toMinutes(t){const [h,m]=String(t||'00:00').split(':').map(Number);return h*60+m;}
function fromMinutes(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function overlaps(a,b,c,d){return a<d && c<b;}
function localDateTime(date,time){return new Date(date+'T'+time+':00');}
function getAvailability(date){
  // Agora verifica primeiro o kanban por data específica
  if(kanbanData[date] && kanbanData[date].cidade){
    return {enabled:true, start:kanbanData[date].start, end:kanbanData[date].end};
  }
  return null;
}
function isWithinBookingWindow(date,time='23:59'){const now=new Date();const minNotice=Math.max(0,Number(state.settings.minNotice)||0);if(localDateTime(date,time).getTime()<now.getTime()+minNotice*3600000)return false;const maxDate=new Date();maxDate.setHours(23,59,59,999);maxDate.setDate(maxDate.getDate()+Math.max(1,Number(state.settings.advanceDays)||60));return localDateTime(date,'23:59').getTime()<=maxDate.getTime();}
function isAvailable(date,time,duration,ignoreId=''){const av=getAvailability(date);if(!av||!av.enabled)return false;const start=toMinutes(time);const end=start+Number(duration);if(start<toMinutes(av.start)||end>toMinutes(av.end))return false;if(!isWithinBookingWindow(date,time))return false;for(const a of state.appointments){if(String(a.id)===String(ignoreId)||a.date!==date||a.status==='cancelled')continue;const svc=serviceById(a.serviceId);const otherDuration=Number(a.duration||(svc&&svc.duration)||60);if(overlaps(start,end,toMinutes(a.time),toMinutes(a.time)+otherDuration))return false;}for(const b of state.blocks){if(b.date===date&&overlaps(start,end,toMinutes(b.start),toMinutes(b.end)))return false;}return true;}
function timeOptions(date,duration){if(!date||!duration)return[];const av=getAvailability(date);if(!av||!av.enabled)return[];const result=[];const interval=Math.max(5,Number(state.interval)||30);for(let m=toMinutes(av.start);m+Number(duration)<=toMinutes(av.end);m+=interval){const time=fromMinutes(m);if(isAvailable(date,time,duration))result.push(time);}return result;}
function datesWithAvailability(duration){const dates=[];const maxDays=Math.max(1,Math.min(365,Number(state.settings.advanceDays)||60));for(let offset=0;offset<=maxDays;offset++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const av=getAvailability(iso);if(av&&av.enabled&&timeOptions(iso,duration).length)dates.push(iso);}return dates;}
function formatDateChip(date){const d=new Date(date+'T12:00:00');return{weekday:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),day:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')};}
function selectDate(date){document.getElementById('appointmentDate').value=date;document.getElementById('appointmentTime').value='';renderDateChoices();renderTimeChoices();updateSelectionSummary();}
function selectTime(time){document.getElementById('appointmentTime').value=time;renderTimeChoices();updateSelectionSummary();}
function renderDateChoices(){const holder=document.getElementById('appointmentDates');const message=document.getElementById('dateSelectionMessage');const service=serviceById(document.getElementById('appointmentService').value);const selected=document.getElementById('appointmentDate').value;holder.innerHTML='';if(!service){message.textContent='Selecione um serviço.';return;}const dates=datesWithAvailability(service.duration);if(!dates.length){message.textContent='Não há datas disponíveis.';return;}message.textContent='Mostrando datas com horário livre.';dates.forEach(date=>{const f=formatDateChip(date);const btn=document.createElement('button');btn.type='button';btn.className='choice-chip date-chip'+(String(selected)===String(date)?' selected':'');btn.innerHTML='<strong>'+esc(f.day)+'</strong><span>'+esc(f.weekday)+'</span>';btn.addEventListener('click',()=>selectDate(date));holder.appendChild(btn);});}
function renderTimeChoices(){const holder=document.getElementById('appointmentTimes');const message=document.getElementById('timeSelectionMessage');const service=serviceById(document.getElementById('appointmentService').value);const date=document.getElementById('appointmentDate').value;const selected=document.getElementById('appointmentTime').value;holder.innerHTML='';if(!service||!date){message.textContent='Selecione serviço e data.';return;}const times=timeOptions(date,service.duration);if(!times.length){message.textContent='Sem horários nesta data.';return;}message.textContent='Selecione um horário:';times.forEach(time=>{const btn=document.createElement('button');btn.type='button';btn.className='choice-chip'+(selected===time?' selected':'');btn.textContent=time;btn.addEventListener('click',()=>selectTime(time));holder.appendChild(btn);});}
function updateSelectionSummary(){const date=document.getElementById('appointmentDate').value;const time=document.getElementById('appointmentTime').value;const service=serviceById(document.getElementById('appointmentService').value);const el=document.getElementById('appointmentSelectionSummary');if(!date||!time||!service){el.textContent='';return;}const d=new Date(date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});el.textContent=d+' às '+time+' · '+service.duration+' min · '+money(service.price);}
function refreshChoices(keepDate=false){const oldDate=document.getElementById('appointmentDate').value;const oldTime=document.getElementById('appointmentTime').value;renderDateChoices();const service=serviceById(document.getElementById('appointmentService').value);const dates=service?datesWithAvailability(service.duration):[];const date=keepDate&&dates.includes(oldDate)?oldDate:'';document.getElementById('appointmentDate').value=date;const times=date&&service?timeOptions(date,service.duration):[];document.getElementById('appointmentTime').value=times.includes(oldTime)?oldTime:'';renderDateChoices();renderTimeChoices();updateSelectionSummary();}

// --- KANBAN LOGIC ---
function getNext30Days(){const days=[];for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()+i);const iso=d.toISOString().slice(0,10);days.push({iso, date:d}); if(!kanbanData[iso]) kanbanData[iso]={cidade:'', start:'09:00', end:'18:00'};} return days;}

function renderKanban(){
  const days=getNext30Days();
  const zones={ 'Severínia': document.getElementById('zone-Sev'), 'Olímpia': document.getElementById('zone-Oli'), '': document.getElementById('zone-Indef') };
  if(!zones['Severínia']) return;
  Object.values(zones).forEach(z=>z.innerHTML='');
  days.forEach(({iso,date})=>{
    const cfg = kanbanData[iso] || {cidade:'', start:'09:00', end:'18:00'};
    const chip = document.createElement('div');
    chip.className = `day-chip ${cfg.cidade==='Severínia'?'severinia':cfg.cidade==='Olímpia'?'olimpia':''}`;
    chip.draggable=true; chip.dataset.iso=iso;
    chip.innerHTML=`<div><strong>${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}</strong><small>${weekdays[date.getDay()].slice(0,3)}</small></div><div class="hours">${cfg.start}-${cfg.end}</div>`;
    chip.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', iso); });
    chip.addEventListener('click', ()=> openEdit(iso));
    zones[cfg.cidade||''].appendChild(chip);
  });
  document.getElementById('count-Sev').textContent=zones['Severínia'].children.length;
  document.getElementById('count-Oli').textContent=zones['Olímpia'].children.length;
  document.getElementById('count-Indef').textContent=zones[''].children.length;
}
function setupDrag(){
  document.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const iso = e.dataTransfer.getData('text/plain');
      const cidade = col.dataset.cidade;
      if(!kanbanData[iso]) kanbanData[iso]={start:'09:00', end:'18:00', cidade:''};
      kanbanData[iso].cidade=cidade;
      renderKanban();
    });
  });
}
let editingIso=null;
function openEdit(iso){
  editingIso=iso;
  const cfg=kanbanData[iso]||{start:'09:00',end:'18:00',cidade:''};
  document.getElementById('editTitle').textContent='Editar '+new Date(iso+'T12:00:00').toLocaleDateString('pt-BR');
  document.getElementById('editStart').value=cfg.start;
  document.getElementById('editEnd').value=cfg.end;
  document.getElementById('editCity').value=cfg.cidade;
  document.getElementById('dayEditPanel').style.display='block';
}
function closeEdit(){ document.getElementById('dayEditPanel').style.display='none'; editingIso=null; }
window.closeEdit=closeEdit;

document.addEventListener('DOMContentLoaded', ()=>{
  const sStart=document.getElementById('editStart');
  const sEnd=document.getElementById('editEnd');
  const sCity=document.getElementById('editCity');
  if(sStart) sStart.addEventListener('change', e=>{ if(editingIso){ kanbanData[editingIso].start=e.target.value; renderKanban(); } });
  if(sEnd) sEnd.addEventListener('change', e=>{ if(editingIso){ kanbanData[editingIso].end=e.target.value; renderKanban(); } });
  if(sCity) sCity.addEventListener('change', e=>{ if(editingIso){ kanbanData[editingIso].cidade=e.target.value; renderKanban(); } });
  const saveBtn=document.getElementById('saveKanbanBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    saveBtn.disabled=true; const old=saveBtn.textContent; saveBtn.textContent='Salvando...';
    try{
      const existentes=await api('/api/admin/disponibilidade');
      for(const it of existentes){ try{ await api('/api/admin/disponibilidade/'+it.id,{method:'DELETE'}); }catch{} }
      let total=0;
      for(const iso in kanbanData){
        const c=kanbanData[iso];
        if(!c.cidade) continue;
        const d=new Date(iso+'T12:00:00'); const diaSemana=d.getDay();
        await api('/api/admin/disponibilidade',{method:'POST',body:{dia_semana:diaSemana, hora_inicio:c.start, hora_fim:c.end, ativo:true, cidade:c.cidade, data_especifica:iso }});
        total++;
      }
      state.interval=Number(document.getElementById('slotIntervalKanban').value||30);
      alert(`Salvo! ${total} dias configurados.`);
      await loadFromServer();
    }catch(err){ alert('Erro: '+err.message); } finally{ saveBtn.disabled=false; saveBtn.textContent=old; }
  });
  setupDrag();
});

document.getElementById('appointmentService').addEventListener('change',()=>refreshChoices(false));
document.getElementById('dashboardDate').value=todayISO();
document.getElementById('dashboardDate').addEventListener('change',renderDashboard);
document.getElementById('filterDate').addEventListener('change',renderAppointments);
document.getElementById('filterStatus').addEventListener('change',renderAppointments);
document.getElementById('clientSearch').addEventListener('input',renderClients);

document.getElementById('appointmentForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const client=document.getElementById('appointmentClient').value.trim();
  const phone=document.getElementById('appointmentPhone').value.trim();
  const serviceId=document.getElementById('appointmentService').value;
  const service=serviceById(serviceId);
  const date=document.getElementById('appointmentDate').value;
  const time=document.getElementById('appointmentTime').value;
  if(!service||!date||!time||!isAvailable(date,time,service.duration)){alert('Horário indisponível.');refreshChoices(true);return;}
  try{
    await api('/api/agendamentos',{method:'POST',body:{nome_cliente:client,telefone_cliente:phone,servico_id:serviceId,data:date,hora_inicio:time,observacoes:document.getElementById('appointmentNotes').value}});
    e.target.reset();document.getElementById('appointmentDate').value='';document.getElementById('appointmentTime').value='';
    await loadFromServer();refreshChoices(false);alert('Agendamento salvo no Supabase!');
  }catch(err){alert(err.message);}
});

document.getElementById('clientForm').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    await api('/api/admin/clientes',{method:'POST',body:{nome:document.getElementById('clientName').value,telefone:document.getElementById('clientPhone').value,email:document.getElementById('clientEmail').value,observacoes:document.getElementById('clientNotes').value}});
    e.target.reset();await loadFromServer();
  }catch(err){alert(err.message);}
});

document.getElementById('serviceForm').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    await api('/api/admin/servicos',{method:'POST',body:{nome:document.getElementById('serviceName').value,preco:Number(document.getElementById('servicePrice').value),duracao_minutos:Number(document.getElementById('serviceDuration').value),categoria:document.getElementById('serviceCategory').value,descricao:document.getElementById('serviceDescription').value}});
    e.target.reset();document.getElementById('serviceDuration').value=60;await loadFromServer();
  }catch(err){alert(err.message);}
});

document.getElementById('blockForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const date=document.getElementById('blockDate').value;
  const start=document.getElementById('blockStart').value;
  const end=document.getElementById('blockEnd').value;
  if(toMinutes(start)>=toMinutes(end)){alert('Fim deve ser depois do início.');return;}
  try{
    await api('/api/admin/bloqueios',{method:'POST',body:{data:date,hora_inicio:start,hora_fim:end,motivo:document.getElementById('blockReason').value}});
    e.target.reset();await loadFromServer();refreshChoices(true);
  }catch(err){alert(err.message);}
});

document.getElementById('settingsForm').addEventListener('submit',e=>{
  e.preventDefault();
  state.settings={studioName:document.getElementById('studioName').value.trim(),title:document.getElementById('studioTitle').value.trim(),phone:document.getElementById('studioPhone').value.trim(),advanceDays:Number(document.getElementById('advanceDays').value),minNotice:Number(document.getElementById('minNotice').value),cancelPolicy:document.getElementById('cancelPolicy').value.trim(),welcomeMessage:document.getElementById('welcomeMessage').value.trim()};
  alert('Configurações salvas localmente nesta sessão.');
});

document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='taiany-backup-supabase.json';a.click();URL.revokeObjectURL(url);
});

async function changeAppointment(id,status){
  try{
    const map={pending:'Pendente',confirmed:'Confirmado',completed:'Concluído',cancelled:'Cancelado'};
    await api('/api/admin/agendamentos/'+id,{method:'PATCH',body:{status:map[status]||status}});
    await loadFromServer();
  }catch(err){alert(err.message);}
}
async function deleteAppointment(id){
  if(!confirm('Excluir este agendamento do Supabase?'))return;
  try{ await api('/api/admin/agendamentos/'+id,{method:'DELETE'}); await loadFromServer(); }catch(err){alert(err.message);}
}
async function deleteClient(id){
  if(!confirm('Excluir esta cliente DEFINITIVAMENTE do Supabase?')) return;
  try{
    await api('/api/admin/clientes/'+id,{method:'DELETE'});
    await loadFromServer();
    alert('Cliente excluída do banco com sucesso!');
  }catch(err){ alert('Erro ao excluir: '+err.message); }
}
async function toggleService(id){
  const s=serviceById(id);
  if(!s) return;
  try{ await api('/api/admin/servicos/'+id,{method:'PATCH',body:{ativo:!s.active}}); await loadFromServer(); }catch(err){alert(err.message);}
}
async function deleteService(id){
  if(!confirm('Excluir este serviço do Supabase?'))return;
  try{ await api('/api/admin/servicos/'+id,{method:'DELETE'}); await loadFromServer(); }catch(err){alert(err.message);}
}
async function deleteBlock(id){
  try{ await api('/api/admin/bloqueios/'+id,{method:'DELETE'}); await loadFromServer(); }catch(err){alert(err.message);}
}

function renderDashboard(){const date=document.getElementById('dashboardDate').value||todayISO();const day=state.appointments.filter(a=>a.date===date&&a.status!=='cancelled');document.getElementById('metricToday').textContent=day.length;document.getElementById('metricConfirmed').textContent=day.filter(a=>a.status==='confirmed').length;document.getElementById('metricClients').textContent=state.clients.length;document.getElementById('metricRevenue').textContent=money(day.reduce((sum,a)=>sum+Number(a.price||0),0));const upcoming=state.appointments.filter(a=>a.date>=todayISO()&&a.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);document.getElementById('dashboardAppointments').innerHTML=upcoming.length?appointmentTable(upcoming,false):'<p class="empty">Nenhum atendimento futuro.</p>';}
function appointmentTable(items,actions=true){if(!items.length)return'<p class="empty">Nenhum agendamento.</p>';return'<div class="table-wrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Situação</th>'+(actions?'<th>Ações</th>':'')+'</tr></thead><tbody>'+items.map(a=>{const svc=serviceById(a.serviceId);return'<tr><td>'+esc(a.date)+'</td><td>'+esc(a.time)+'</td><td>'+esc(a.client)+'</td><td>'+esc(svc?svc.name:'—')+'</td><td>'+money(a.price)+'</td><td><span class="status '+esc(a.status)+'">'+esc(statusLabel(a.status))+'</span></td>'+(actions?'<td><select onchange="changeAppointment(\''+a.id+'\',this.value)"><option value="'+esc(a.status)+'">'+esc(statusLabel(a.status))+'</option><option value="confirmed">Confirmado</option><option value="pending">Pendente</option><option value="completed">Concluído</option><option value="cancelled">Cancelado</option></select> <button class="button danger small" onclick="deleteAppointment(\''+a.id+'\')">Excluir</button></td>':'')+'</tr>';}).join('')+'</tbody></table></div>';}
function renderAppointments(){const date=document.getElementById('filterDate').value;const status=document.getElementById('filterStatus').value;const list=state.appointments.filter(a=>(!date||a.date===date)&&(!status||a.status===status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));document.getElementById('appointmentsTable').innerHTML=appointmentTable(list,true);}
function renderClients(){const q=(document.getElementById('clientSearch').value||'').toLowerCase();const clients=state.clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q));document.getElementById('clientsTable').innerHTML=clients.length?'<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Atendimentos</th><th>Ação</th></tr></thead><tbody>'+clients.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.email||'—')+'</td><td>'+state.appointments.filter(a=>a.phone===c.phone&&a.status!=='cancelled').length+'</td><td><button class="button danger small" onclick="deleteClient(\''+c.id+'\')">Excluir do Supabase</button></td></tr>').join('')+'</tbody></table></div>':'<p class="empty">Nenhuma cliente no Supabase.</p>';}
function renderServices(){const select=document.getElementById('appointmentService');const old=select.value;select.innerHTML='<option value="">Selecione um serviço</option>'+state.services.filter(s=>s.active!==false).map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' · '+money(s.price)+' · '+s.duration+' min</option>').join('');if(state.services.some(s=>String(s.id)===String(old))) select.value=old;document.getElementById('servicesTable').innerHTML=state.services.length?'<div class="table-wrap"><table><thead><tr><th>Serviço</th><th>Categoria</th><th>Duração</th><th>Preço</th><th>Disponível</th><th>Ações</th></tr></thead><tbody>'+state.services.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.category)+'</td><td>'+s.duration+' min</td><td>'+money(s.price)+'</td><td>'+(s.active!==false?'Sim':'Não')+'</td><td><button class="button secondary small" onclick="toggleService(\''+s.id+'\')">'+(s.active!==false?'Desativar':'Ativar')+'</button> <button class="button danger small" onclick="deleteService(\''+s.id+'\')">Excluir</button></td></tr>').join('')+'</tbody></table></div>':'<p class="empty">Nenhum serviço.</p>';}
function renderBlocks(){document.getElementById('blocksTable').innerHTML=state.blocks.length?'<div class="table-wrap"><table><thead><tr><th>Data</th><th>Período</th><th>Motivo</th><th>Ação</th></tr></thead><tbody>'+state.blocks.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(b=>'<tr><td>'+esc(b.date)+'</td><td>'+esc(b.start)+'–'+esc(b.end)+'</td><td>'+esc(b.reason||'—')+'</td><td><button class="button danger small" onclick="deleteBlock(\''+b.id+'\')">Remover</button></td></tr>').join('')+'</tbody></table></div>':'<p class="empty">Nenhum bloqueio.</p>';}
function renderSettings(){const s=state.settings;for(const [id,key] of [['studioName','studioName'],['studioTitle','title'],['studioPhone','phone'],['advanceDays','advanceDays'],['minNotice','minNotice'],['cancelPolicy','cancelPolicy'],['welcomeMessage','welcomeMessage']]){const el=document.getElementById(id);if(el&&document.activeElement!==el) el.value=s[key]??'';}document.getElementById('publicLink').textContent=location.origin+'/agendar';}
function renderAll(){renderDashboard();renderAppointments();renderClients();renderServices();renderKanban();renderBlocks();renderSettings();refreshChoices(true);}

loadFromServer();
</script>
