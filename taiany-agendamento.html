
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#bd7896">
<meta name="description" content="Agende seu atendimento com Taiany Trindade, Nail Designer. Consulte serviços, valores e horários disponíveis.">
<title>Taiany Trindade | Agendamento Inteligente</title>

<style>
:root {
  --pink: #bd7896;
  --pink-dark: #985674;
  --pink-light: #fbeaf1;
  --cream: #fffaf8;
  --ink: #34262d;
  --muted: #887780;
  --line: #f0e1e8;
  --white: #fff;
  --green: #2e7d5a;
  --copper: #9b5c43;
  --danger: #a32d45;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Inter, system-ui, Arial, sans-serif;
}

button, input { font: inherit; }

button:focus-visible, input:focus-visible {
  outline: 3px solid #d7a2ba;
  outline-offset: 3px;
}

.topbar {
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  background: var(--pink);
  display: grid;
  place-items: center;
  overflow: hidden;
  flex-shrink: 0;
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 4px;
  background: #fff;
  border-radius: 10px;
}

.chat-wrap {
  width: min(100% - 16px, 740px);
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.progress {
  height: 4px;
  background: var(--line);
  border-radius: 99px;
  margin: 10px 0;
  overflow: hidden;
}

.progress i {
  display: block;
  height: 100%;
  background: var(--pink);
  width: 0;
  transition: width .3s;
}

.chat {
  flex: 1;
  min-height: 300px;
  overflow-y: auto;
  padding: 16px 6px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bubble {
  max-width: 85%;
  padding: 14px 16px;
  border-radius: 20px;
  font-size: 14.5px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  animation: pop .18s ease;
}

.bubble.bot {
  background: #fff;
  border: 1px solid var(--line);
  border-bottom-left-radius: 6px;
  align-self: flex-start;
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
}

.bubble.user {
  background: var(--pink);
  color: #fff;
  border-bottom-right-radius: 6px;
  align-self: flex-end;
}

.bubble.error {
  border-color: #f0c6ce;
  color: var(--danger);
}

.quick {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 4px 0;
}

.qbtn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 999px;
  padding: 10px 14px;
  font-weight: 650;
  font-size: 13px;
  cursor: pointer;
}

.qbtn.primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

.qbtn:disabled, .card:disabled, .chip:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
  width: 100%;
}

.card {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 16px;
  padding: 14px;
  text-align: left;
  cursor: pointer;
  transition: .15s;
  min-width: 0;
}

.card:hover {
  border-color: var(--pink);
  transform: translateY(-1px);
}

.card b {
  display: block;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.card small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
  line-height: 1.4;
}

.card .price {
  margin-top: 8px;
  color: var(--pink-dark);
  font-weight: 800;
}

.time-group { margin-top: 10px; }

.time-group label {
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 10px 0 6px;
  display: block;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 999px;
  padding: 10px 14px;
  font-weight: 700;
  cursor: pointer;
}

.chip:hover {
  border-color: var(--pink);
}

.chip.sel {
  background: var(--copper);
  color: #fff;
  border-color: var(--copper);
}

.summary {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.inputbar {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid var(--line);
  border-radius: 0 0 20px 20px;
  position: sticky;
  bottom: 0;
}

.inputbar input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 12px 16px;
  outline: none;
  background: #fff;
  color: var(--ink);
}

.inputbar button {
  border: 0;
  background: var(--pink);
  color: #fff;
  border-radius: 999px;
  padding: 0 18px;
  font-weight: 800;
  min-height: 44px;
  cursor: pointer;
}

.inputbar button:disabled {
  opacity: .6;
  cursor: wait;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20,12,16,.55);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 18px;
}

.modal-overlay.show { display: flex; }

.modal {
  width: min(100%, 480px);
  max-height: 90dvh;
  overflow-y: auto;
  background: #fff;
  border-radius: 28px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 30px 90px rgba(0,0,0,.25);
}

.modal-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #eaf7ef;
  color: var(--green);
  display: grid;
  place-items: center;
  font-size: 38px;
  margin: 0 auto 14px;
}

.modal-close {
  width: 100%;
  min-height: 50px;
  border: 0;
  border-radius: 12px;
  background: var(--pink);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  margin-top: 10px;
}

@keyframes pop {
  from { transform: translateY(6px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@media(max-width:600px) {
  .cards { grid-template-columns: 1fr; }
  .bubble { max-width: 94%; }
  .modal { padding: 22px; }
  .inputbar { padding: 10px 6px; }
  .inputbar button { padding: 0 14px; }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="chat-wrap">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <img
          src="/logo.png"
          alt="Logo Taiany Trindade"
          onerror="this.style.display='none';this.parentElement.textContent='TT';this.parentElement.style.color='#fff';this.parentElement.style.fontSize='28px'"
        >
      </div>
      <div>
        <div style="font-family:Georgia,serif;font-size:18px">Taiany Trindade</div>
        <div style="font-size:10px;letter-spacing:2px;color:#887780">
          Nail Designer • Agendamento online
        </div>
      </div>
    </div>
  </header>

  <div class="progress" aria-label="Progresso do agendamento">
    <i id="progress"></i>
  </div>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="inputForm" class="inputbar">
    <input
      id="input"
      placeholder="Digite sua resposta..."
      autocomplete="on"
      aria-label="Sua resposta"
    >
    <button id="send" type="submit">Enviar</button>
  </form>
</div>

<div
  id="successModal"
  class="modal-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalTitle"
>
  <div class="modal">
    <div class="modal-icon">✓</div>
    <h2 id="modalTitle" style="font-family:Georgia,serif;font-size:28px;margin:0 0 6px">
      Agendamento confirmado!
    </h2>
    <p style="color:#887780">
      Seu horário foi registrado no sistema da Taiany.
    </p>
    <div id="modalDetails" class="summary" style="text-align:left;margin:14px 0"></div>
    <button id="closeModal" class="modal-close" type="button">Fechar</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const chat = $('chat');
  const input = $('input');
  const send = $('send');
  const inputForm = $('inputForm');
  const progress = $('progress');

  const S = {
    step: 'start',
    services: [],
    availability: [],
    service: null,
    date: null,
    time: null,
    name: '',
    phone: '',
    email: '',
    notes: '',
    sending: false
  };

  const money = value =>
    Number(value || 0).toLocaleString('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    });

  const esc = value =>
    String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);

  function localISO(date = new Date()) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function dateFromISO(iso) {
    const [year, month, day] = iso.split('-').map(Number);
    return new Date(year, month - 1, day, 12, 0, 0, 0);
  }

  function mins(time) {
    const parts = String(time || '').split(':').map(Number);
    return parts[0] * 60 + parts[1];
  }

  function setProgress(value) {
    progress.style.width = `${Math.max(0, Math.min(100, value))}%`;
  }

  function scrollChat() {
    chat.scrollTop = chat.scrollHeight;
  }

  function bubble(text, type = 'bot', html = false) {
    const element = document.createElement('div');
    element.className = `bubble ${type}`;
    if (html) element.innerHTML = text;
    else element.textContent = text;
    chat.appendChild(element);
    scrollChat();
    return element;
  }

  function quickBtns(items, callback) {
    const wrap = document.createElement('div');
    wrap.className = 'quick';

    items.forEach(item => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `qbtn ${item.primary ? 'primary' : ''}`;
      button.textContent = item.label;

      button.addEventListener('click', () => {
        if (button.disabled) return;

        wrap.querySelectorAll('button').forEach(b => {
          b.disabled = true;
        });

        bubble(item.label, 'user');
        callback(item);
      });

      wrap.appendChild(button);
    });

    chat.appendChild(wrap);
    scrollChat();
  }

  async function api(url, options = {}) {
    const headers = { ...(options.headers || {}) };

    if (options.body && !headers['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }

    const response = await fetch(url, {
      ...options,
      headers,
      credentials: 'same-origin'
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok || result.ok === false) {
      throw new Error(
        result.error ||
        `Não foi possível concluir a solicitação (HTTP ${response.status}).`
      );
    }

    return result;
  }

  function normalizePhone(value) {
    return String(value || '').replace(/\D/g, '');
  }

  function validEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  async function start() {
    bubble('Olá! Eu sou a secretária virtual da Taiany 💅', 'bot');
    bubble(
      'Vou ajudar você a escolher o serviço e encontrar um horário disponível.',
      'bot'
    );

    try {
      const [servicesResult, availabilityResult] = await Promise.all([
        api('/api/servicos'),
        api('/api/disponibilidade')
      ]);

      S.services = Array.isArray(servicesResult.data)
        ? servicesResult.data
        : [];

      S.availability = Array.isArray(availabilityResult.data)
        ? availabilityResult.data
        : [];

      // Não consulta /api/admin/clientes nem acessa tabelas do Supabase
      // diretamente pelo navegador.
    } catch (error) {
      bubble(
        'Não consegui carregar os serviços e horários neste momento. ' +
        'Atualize a página em alguns instantes. ' + error.message,
        'error'
      );
      return;
    }

    if (!S.services.length) {
      bubble('Ainda não há serviços disponíveis para agendamento.', 'bot');
      return;
    }

    quickBtns([
      { label: '📅 Quero agendar', value: 'book', primary: true },
      { label: '💅 Ver serviços e valores', value: 'services' }
    ], item => {
      if (item.value === 'book') {
        showServices();
      } else {
        showServices();
      }
    });

    setProgress(10);
  }

  function showServices() {
    S.step = 'service';
    bubble('Escolha o serviço que deseja realizar:', 'bot');

    const wrap = document.createElement('div');
    wrap.className = 'cards';

    S.services.forEach(service => {
      // Não exibe serviços explicitamente desativados.
      if (service.ativo === false) return;

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'card';

      const name = document.createElement('b');
      name.textContent = service.nome || 'Serviço';

      const description = document.createElement('small');
      description.textContent =
        service.descricao || service.categoria || 'Atendimento personalizado';

      const price = document.createElement('div');
      price.className = 'price';

      const duration = Number(
        service.duracao_minutos || service.duracao || 60
      );

      price.textContent =
        `${money(service.preco)} • ${duration} min`;

      button.append(name, description, price);

      button.addEventListener('click', () => {
        S.service = service;
        S.date = null;
        S.time = null;

        bubble(
          `${service.nome} — ${money(service.preco)}`,
          'user'
        );

        wrap.remove();
        askPhone();
      });

      wrap.appendChild(button);
    });

    if (!wrap.children.length) {
      bubble('Não há serviços ativos disponíveis para selecionar.', 'bot');
      return;
    }

    chat.appendChild(wrap);
    scrollChat();
    setProgress(20);
  }

  function askPhone() {
    S.step = 'phone';
    bubble('Perfeito! Qual é seu WhatsApp com DDD?', 'bot');
    input.placeholder = '(00) 00000-0000';
    input.autocomplete = 'tel';
    input.inputMode = 'tel';
    input.focus();
    setProgress(30);
  }

  function askName() {
    S.step = 'name';
    bubble('Qual é seu nome completo?', 'bot');
    input.placeholder = 'Seu nome completo';
    input.autocomplete = 'name';
    input.inputMode = 'text';
    input.focus();
    setProgress(40);
  }

  function askEmail() {
    S.step = 'email';
    bubble('Qual é seu e-mail? Se preferir não informar, escreva "pular".', 'bot');
    input.placeholder = 'E-mail ou pular';
    input.autocomplete = 'email';
    input.inputMode = 'email';
    input.focus();
    setProgress(50);
  }

  async function askDate() {
    if (!S.service) {
      showServices();
      return;
    }

    S.step = 'date';
    S.date = null;
    S.time = null;

    setProgress(60);
    bubble(
      'Vou consultar os horários disponíveis para esse serviço. Isso pode levar alguns segundos...',
      'bot'
    );

    const duration = Number(
      S.service.duracao_minutos || S.service.duracao || 60
    );

    if (!Number.isFinite(duration) || duration <= 0) {
      bubble('A duração desse serviço está configurada incorretamente.', 'error');
      return;
    }

    const dates = [];
    const todayISO = localISO();

    // Consulta a API real, que já aplica duração, disponibilidade,
    // bloqueios e agendamentos existentes.
    for (let offset = 0; offset <= 60; offset++) {
      const date = dateFromISO(todayISO);
      date.setDate(date.getDate() + offset);
      const iso = localISO(date);

      try {
        const result = await api(
          `/api/horarios?data=${encodeURIComponent(iso)}` +
          `&servico_id=${encodeURIComponent(S.service.id)}`
        );

        const times = Array.isArray(result.data) ? result.data : [];

        const availableTimes = times.filter(time => {
          if (!/^\d{2}:\d{2}(:\d{2})?$/.test(String(time))) {
            return false;
          }

          if (iso === todayISO) {
            return mins(time) > new Date().getHours() * 60 +
              new Date().getMinutes();
          }

          return true;
        });

        if (availableTimes.length) {
          dates.push({ date: iso, times: availableTimes });
        }
      } catch (error) {
        console.error(`Falha ao consultar horários de ${iso}:`, error);
      }

      if (dates.length >= 14) break;
    }

    if (!dates.length) {
      bubble(
        'Não encontrei horários disponíveis nos próximos 60 dias para esse serviço.',
        'bot'
      );

      quickBtns([
        { label: 'Escolher outro serviço', value: 'other', primary: true },
        { label: 'Tentar novamente', value: 'retry' }
      ], item => {
        if (item.value === 'other') showServices();
        else askDate();
      });

      return;
    }

    bubble('Escolha a data que funciona melhor para você:', 'bot');

    const groups = {
      'Hoje': [],
      'Amanhã': [],
      'Essa semana': [],
      'Próximas semanas': []
    };

    dates.forEach(item => {
      const diff = Math.round(
        (dateFromISO(item.date) - dateFromISO(todayISO)) / 86400000
      );

      if (diff === 0) groups['Hoje'].push(item);
      else if (diff === 1) groups['Amanhã'].push(item);
      else if (diff <= 7) groups['Essa semana'].push(item);
      else groups['Próximas semanas'].push(item);
    });

    for (const [label, items] of Object.entries(groups)) {
      if (!items.length) continue;

      const group = document.createElement('section');
      group.className = 'time-group';

      const heading = document.createElement('label');
      heading.textContent = label;

      const chips = document.createElement('div');
      chips.className = 'chips';

      items.forEach(item => {
        const date = dateFromISO(item.date);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chip';

        button.textContent = date.toLocaleDateString('pt-BR', {
          weekday: 'short',
          day: '2-digit',
          month: 'short'
        });

        button.addEventListener('click', () => {
          S.date = item.date;
          S.dayTimes = item.times;

          bubble(
            date.toLocaleDateString('pt-BR', {
              weekday: 'long',
              day: '2-digit',
              month: 'long',
              year: 'numeric'
            }),
            'user'
          );

          chat.querySelectorAll('.time-group').forEach(el => el.remove());
          askTime();
        });

        chips.appendChild(button);
      });

      group.append(heading, chips);
      chat.appendChild(group);
    }

    scrollChat();
  }

  function askTime() {
    S.step = 'time';
    setProgress(75);

    bubble(
      `Estes são os horários disponíveis para ${dateFromISO(S.date).toLocaleDateString('pt-BR')}:`,
      'bot'
    );

    const times = Array.isArray(S.dayTimes) ? S.dayTimes : [];

    if (!times.length) {
      bubble('Não há mais horários disponíveis nessa data.', 'bot');
      askDate();
      return;
    }

    const groups = {
      'Manhã': [],
      'Tarde': [],
      'Noite': []
    };

    times.forEach(time => {
      const minute = mins(time);

      if (minute < 12 * 60) groups['Manhã'].push(time);
      else if (minute < 18 * 60) groups['Tarde'].push(time);
      else groups['Noite'].push(time);
    });

    for (const [label, items] of Object.entries(groups)) {
      if (!items.length) continue;

      const group = document.createElement('section');
      group.className = 'time-group';

      const heading = document.createElement('label');
      heading.textContent = label;

      const chips = document.createElement('div');
      chips.className = 'chips';

      items.forEach(time => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chip';
        button.textContent = time.slice(0, 5);

        button.addEventListener('click', () => {
          S.time = time.slice(0, 5);

          bubble(S.time, 'user');
          chat.querySelectorAll('.time-group').forEach(el => el.remove());
          askNotes();
        });

        chips.appendChild(button);
      });

      group.append(heading, chips);
      chat.appendChild(group);
    }

    scrollChat();
  }

  function askNotes() {
    S.step = 'notes';
    setProgress(85);

    bubble(
      'Quase lá! Deseja informar alguma observação, como cor ou formato? Se não, escreva "pular".',
      'bot'
    );

    input.placeholder = 'Observação ou pular';
    input.autocomplete = 'off';
    input.inputMode = 'text';
    input.focus();
  }

  async function confirmBooking() {
    if (S.sending) return;

    if (!S.service || !S.date || !S.time || !S.name || !S.phone) {
      bubble(
        'Faltam informações para concluir o agendamento. Vamos recomeçar.',
        'error'
      );
      showServices();
      return;
    }

    S.sending = true;
    send.disabled = true;
    input.disabled = true;

    bubble('Estou confirmando seu horário...', 'bot');

    const payload = {
      nome_cliente: S.name,
      telefone_cliente: S.phone,
      servico_id: S.service.id,
      data: S.date,
      hora_inicio: S.time,
      observacoes: S.notes
    };

    try {
      const result = await api('/api/agendamentos', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const booking = result.data || {};

      $('modalDetails').innerHTML = `
        <b>Serviço:</b> ${esc(booking.nome_servico || S.service.nome)}<br>
        <b>Data:</b> ${esc(S.date.split('-').reverse().join('/'))}<br>
        <b>Horário:</b> ${esc(String(booking.hora_inicio || S.time).slice(0, 5))}
        ${booking.hora_fim ? ` - ${esc(String(booking.hora_fim).slice(0, 5))}` : ''}<br>
        <b>Valor:</b> ${money(booking.preco ?? S.service.preco)}<br>
        <b>Cliente:</b> ${esc(S.name)}<br>
        <b>WhatsApp:</b> ${esc(S.phone)}<br><br>
        <small style="color:#887780">
          Guarde os dados do seu agendamento. Se precisar alterar o horário,
          entre em contato diretamente com a Taiany.
        </small>
      `;

      $('successModal').classList.add('show');
      setProgress(100);
      S.step = 'complete';
    } catch (error) {
      bubble(
        `Não consegui confirmar o agendamento: ${error.message}`,
        'error'
      );

      bubble(
        'O horário pode ter sido ocupado por outra pessoa. Consulte novamente antes de tentar reservar.',
        'bot'
      );

      quickBtns([
        { label: 'Ver outros horários', value: 'retry', primary: true },
        { label: 'Escolher outro serviço', value: 'other' }
      ], item => {
        if (item.value === 'other') showServices();
        else askDate();
      });
    } finally {
      S.sending = false;
      send.disabled = false;
      input.disabled = false;
      input.placeholder = 'Digite sua resposta...';
    }
  }

  async function handleInput(event) {
    if (event) event.preventDefault();
    if (S.sending) return;

    const value = input.value.trim();
    if (!value) return;

    input.value = '';
    bubble(value, 'user');

    switch (S.step) {
      case 'phone': {
        const phone = normalizePhone(value);

        if (phone.length < 10 || phone.length > 13) {
          bubble(
            'Esse número parece incompleto. Informe o WhatsApp com DDD, por exemplo: (17) 99123-4567.',
            'error'
          );
          return;
        }

        S.phone = phone;
        askName();
        return;
      }

      case 'name': {
        if (value.replace(/\s/g, '').length < 2) {
          bubble('Por favor, informe seu nome para continuar.', 'error');
          return;
        }

        S.name = value.slice(0, 150);
        askEmail();
        return;
      }

      case 'email': {
        if (value.toLowerCase() === 'pular') {
          S.email = '';
        } else if (validEmail(value)) {
          S.email = value.slice(0, 200);
        } else {
          bubble(
            'O e-mail parece inválido. Digite um e-mail válido ou escreva "pular".',
            'error'
          );
          return;
        }

        askDate();
        return;
      }

      case 'notes': {
        S.notes = value.toLowerCase() === 'pular' ? '' : value.slice(0, 1000);
        await confirmBooking();
        return;
      }

      default:
        bubble(
          'Escolha uma das opções apresentadas na conversa para continuar.',
          'bot'
        );
    }
  }

  inputForm.addEventListener('submit', handleInput);

  $('closeModal').addEventListener('click', () => {
    $('successModal').classList.remove('show');
    location.reload();
  });

  $('successModal').addEventListener('click', event => {
    if (event.target === $('successModal')) {
      $('successModal').classList.remove('show');
    }
  });

  start();
})();
</script>
</body>
</html>
