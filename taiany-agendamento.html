<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8fb">
<title>Agende com Taiany | Secretária Virtual</title>
<style>
:root{--pink:#bd7896;--pink-dark:#985674;--pink-light:#f9eaf1;--cream:#fffaf8;--ink:#34262d;--muted:#887780;--line:#f0e1e8;--white:#fff;--copper:#9b5c43;--green:#2e7d5a}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:Inter,Arial,sans-serif}
.topbar{padding:16px 20px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;justify-content:center}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:90px;height:90px;flex:0 0 90px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:16px;background:var(--pink);border:2px solid #ead6c8;box-shadow:0 4px 20px rgba(189,120,150,.25)}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:5px;background:#fff;border-radius:12px;display:block}
.brand-name{font-family:Georgia,serif;font-size:21px} .brand-subtitle{color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.hero{text-align:center;padding:24px 20px 10px}
.hero h1{font-family:Georgia,serif;font-size:32px;margin:8px 0 6px} .hero p{color:var(--muted);font-size:14px;max-width:480px;margin:0 auto}
.chat-wrap{width:min(100% - 24px, 720px);margin:20px auto 60px;background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 50px rgba(104,54,78,.08);overflow:hidden;display:flex;flex-direction:column;height:72vh;min-height:560px}
.chat-messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(to bottom,#fff,#fffaf8)}
.bubble{max-width:82%;padding:13px 15px;border-radius:18px;font-size:14px;line-height:1.45;animation:pop .2s ease}
.bubble.bot{background:#f9eaf1;color:var(--ink);border-bottom-left-radius:6px;align-self:flex-start}
.bubble.user{background:var(--pink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.bubble.typing{opacity:.6;font-style:italic}
.choice-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choice-chip{min-width:66px;border:1px solid #d9c9bf;border-radius:999px;padding:10px 14px;background:#fff;color:var(--ink);text-align:center;font-weight:650;cursor:pointer;transition:.15s}
.choice-chip:hover{border-color:var(--copper);color:var(--copper)}
.choice-chip.selected{background:var(--copper);color:#fff;border-color:var(--copper)}
.date-chip{min-width:88px} .date-chip strong{display:block;font-size:14px} .date-chip span{display:block;font-size:11px;color:var(--muted)} .choice-chip.selected span{color:#fff}
.input-row{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#fff}
.input-row input{flex:1;min-height:46px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:none}
.input-row button{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:800}
.input-row button:disabled{opacity:.5}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}

/* POP-UP GRANDE DE SUCESSO */
.modal-overlay{position:fixed;inset:0;background:rgba(52,38,45,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}
.modal-overlay.show{display:flex}
.modal{width:min(100%,460px);background:#fff;border-radius:24px;padding:32px 26px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.18);animation:pop .25s ease}
.modal-icon{width:72px;height:72px;border-radius:50%;background:#eaf7ef;color:var(--green);display:grid;place-items:center;font-size:36px;margin:0 auto 16px}
.modal h2{font-family:Georgia,serif;font-size:28px;margin:0 0 8px}
.modal p{color:var(--muted);font-size:14px;margin:0 0 18px}
.modal .details{background:#fff8fb;border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;text-align:left;font-size:13px}
.modal .primary{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark"><img src="/logo.png" alt="logo" onerror="this.style.display='none';this.parentElement.textContent='TT';this.parentElement.style.color='#fff';this.parentElement.style.fontSize='32px';this.parentElement.style.fontFamily='Georgia,serif'"></div><div><div class="brand-name">Taiany Trindade</div><div class="brand-subtitle">Secretária Virtual</div></div></div></header>
<div class="hero"><h1>Olá! Eu sou a secretária da Taiany 💅</h1><p>Vou te ajudar a encontrar o melhor horário. É rapidinho!</p></div>
<div class="chat-wrap"><div id="chat" class="chat-messages"></div><div class="input-row"><input id="userInput" placeholder="Digite sua mensagem..." autocomplete="off"><button id="sendBtn">Enviar</button></div></div>

<!-- MODAL GRANDE -->
<div id="successModal" class="modal-overlay"><div class="modal"><div class="modal-icon">✓</div><h2>Agendamento Confirmado!</h2><p>Seu horário foi reservado com sucesso no Supabase.</p><div id="modalDetails" class="details"></div><button class="primary" onclick="document.getElementById('successModal').classList.remove('show'); location.reload();">Agendar outro horário</button></div></div>

<script>
(()=>'use strict';
const $=id=>document.getElementById(id);
const chat=$('chat');const input=$('userInput');const sendBtn=$('sendBtn');
const state={step:'welcome',services:[],availability:[],client:null,allClients:[],selectedService:null,selectedDate:null,selectedTime:null,name:'',phone:'',email:'',notes:''};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayLocal(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function minutes(v){const p=String(v).split(':').map(Number);return p[0]*60+p[1];}
function hasConflict(s,e,list){return list.some(it=>s<minutes(it.hora_fim)&&e>minutes(it.hora_inicio));}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||'Erro');return j;}
function addBubble(text,type='bot',html=false){
  const div=document.createElement('div');div.className='bubble '+type;
  if(html)div.innerHTML=text;else div.textContent=text;
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div;
}
function addChoices(items,onSelect){
  const wrap=document.createElement('div');wrap.className='choice-group';
  items.forEach(it=>{
    const b=document.createElement('button');b.className='choice-chip '+(it.class||'');b.innerHTML=it.label;
    if(it.disabled)b.disabled=true;
    b.onclick=()=>{wrap.querySelectorAll('.choice-chip').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');onSelect(it);};
    wrap.appendChild(b);
  });
  chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;
}
async function botTyping(msg,delay=600){const t=addBubble('Digitando...','bot typing');await new Promise(r=>setTimeout(r,delay));t.remove();addBubble(msg,'bot');}

async function init(){
  try{
    const [s,a,c]=await Promise.all([api('/api/servicos'),api('/api/disponibilidade'),api('/api/admin/clientes').catch(()=>({data:[]}))]);
    state.services=s.data||[];state.availability=a.data||[];state.allClients=c.data||c||[];
  }catch{}
  await botTyping('Olá! Que bom te ver por aqui! ✨');
  await new Promise(r=>setTimeout(r,400));
  addBubble('Você já é cliente da Taiany?', 'bot');
  addChoices([{label:'Sim, já sou cliente 💖',value:'sim'},{label:'Não, primeira vez',value:'nao'}],async choice=>{
    addBubble(choice.label,'user');
    if(choice.value==='sim'){state.step='askName';await botTyping('Que ótimo! Me diz seu nome ou WhatsApp que vou te procurar aqui no sistema 🔍');input.placeholder='Digite seu nome ou WhatsApp...';input.focus();}
    else{state.step='newName';await botTyping('Seja bem-vinda! Vamos fazer seu cadastro rapidinho. Qual seu nome completo?');input.placeholder='Seu nome completo';}
  });
}

async function handleInput(){
  const val=input.value.trim();if(!val)return;
  addBubble(val,'user');input.value='';
  if(state.step==='askName'){
    const q=val.toLowerCase();
    const found=state.allClients.filter(c=>(c.nome+' '+c.telefone).toLowerCase().includes(q));
    if(found.length){
      state.client=found[0];state.name=found[0].nome;state.phone=found[0].telefone;state.email=found[0].email||'';
      await botTyping(`Achei você! Olá, ${esc(found[0].nome)}! 😍`);
      if(found.length>1){
        addBubble('Encontrei mais de um cadastro, selecione o seu:','bot');
        addChoices(found.map(f=>({label:`${esc(f.nome)} - ${esc(f.telefone)}`,value:f})),async ch=>{state.client=ch.value;state.name=ch.value.nome;state.phone=ch.value.telefone;await askService();});
        return;
      }
      await askService();
    }else{
      await botTyping(`Não encontrei seu cadastro com "${esc(val)}". Quer se cadastrar como nova cliente ou tentar outro nome?`);
      addChoices([{label:'Tentar outro nome',value:'retry'},{label:'Cadastrar como nova',value:'new'}],async ch=>{
        addBubble(ch.label,'user');
        if(ch.value==='retry'){state.step='askName';input.placeholder='Digite outro nome ou WhatsApp';}
        else{state.step='newName';await botTyping('Perfeito! Qual seu nome completo?');input.placeholder='Seu nome completo';}
      });
    }
  } else if(state.step==='newName'){
    state.name=val;state.step='newPhone';await botTyping(`Prazer, ${esc(val)}! Qual seu WhatsApp com DDD?`);input.placeholder='(00) 00000-0000';
  } else if(state.step==='newPhone'){
    state.phone=val;state.step='newEmail';await botTyping('E seu e-mail? (opcional, pode escrever "pular")');input.placeholder='Seu e-mail ou "pular"';
  } else if(state.step==='newEmail'){
    state.email=val.toLowerCase()==='pular'?'':val;await askService();
  } else if(state.step==='askNotes'){
    state.notes=val.toLowerCase()==='pular'?'':val;await confirmBooking();
  }
}

async function askService(){
  state.step='service';
  await botTyping('Agora vamos escolher o que você quer fazer 💅');
  addBubble('Qual serviço você deseja? Selecione abaixo:','bot',true);
  const wrap=document.createElement('div');wrap.className='choice-group';
  state.services.forEach(s=>{
    const b=document.createElement('button');b.className='choice-chip';b.style.minWidth='180px';b.style.textAlign='left';
    b.innerHTML=`<strong>${esc(s.nome)}</strong><br><small>${money(s.preco)} • ${s.duracao_minutos} min</small>`;
    b.onclick=async()=>{state.selectedService=s;addBubble(`${s.nome} - ${money(s.preco)}`,'user');wrap.remove();await askDate();};
    wrap.appendChild(b);
  });
  chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;
}

async function askDate(){
  await botTyping('Ótima escolha! Deixa eu ver as datas disponíveis pra esse serviço...');
  const duration=Number(state.selectedService.duracao_minutos);
  const dates=[];
  for(let off=0;off<=60;off++){
    const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);
    const iso=d.toISOString().slice(0,10);const wd=d.getDay();
    const periods=state.availability.filter(p=>Number(p.dia_semana)===wd);if(!periods.length)continue;
    try{
      const res=await api('/api/horarios?data='+encodeURIComponent(iso));
      const occ=res.ocupados||[];const blo=res.bloqueios||[];
      let has=false;
      for(const per of periods){
        const open=minutes(per.hora_inicio);const close=minutes(per.hora_fim);
        for(let st=open;st+duration<=close;st+=30){const en=st+duration;if(hasConflict(st,en,occ)||hasConflict(st,en,blo))continue;has=true;break;}
        if(has)break;
      }
      if(has)dates.push(iso);
    }catch{}
    if(dates.length>=12)break;
  }
  if(!dates.length){await botTyping('Poxa, não tenho datas livres nos próximos 60 dias pra esse serviço. Tenta outro serviço?');await askService();return;}
  addBubble('Tenho essas datas com horário livre. Qual prefere?','bot');
  const items=dates.map(iso=>{
    const d=new Date(iso+'T12:00:00');
    const wd=d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    const day=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
    return {label:`<strong>${esc(day)}</strong><span>${esc(wd)}</span>`,class:'date-chip',value:iso};
  });
  addChoices(items,async ch=>{state.selectedDate=ch.value;addBubble(formatDate(ch.value),'user');await askTime();});
}
function formatDate(v){const [y,m,d]=v.split('-');return `${d}/${m}/${y}`;}

async function askTime(){
  await botTyping(`Verificando horários do dia ${formatDate(state.selectedDate)}...`);
  try{
    const res=await api('/api/horarios?data='+encodeURIComponent(state.selectedDate));
    state.occupied=res.ocupados||[];state.blocks=res.bloqueios||[];
  }catch{state.occupied=[];state.blocks=[];}
  const duration=Number(state.selectedService.duracao_minutos);
  const weekday=new Date(state.selectedDate+'T12:00:00Z').getUTCDay();
  const periods=state.availability.filter(p=>Number(p.dia_semana)===weekday);
  const all=[];
  periods.forEach(per=>{
    const open=minutes(per.hora_inicio);const close=minutes(per.hora_fim);
    for(let st=open;st+duration<=close;st+=30){
      const en=st+duration;const blocked=hasConflict(st,en,state.blocks);const busy=hasConflict(st,en,state.occupied);
      const todayPast=state.selectedDate===todayLocal()&&st<=(new Date().getHours()*60+new Date().getMinutes());
      if(blocked||busy||todayPast)continue;
      const label=String(Math.floor(st/60)).padStart(2,'0')+':'+String(st%60).padStart(2,'0');all.push(label);
    }
  });
  const unique=[...new Set(all)].sort();
  if(!unique.length){await botTyping('Essa data lotou! Escolhe outra data?');await askDate();return;}
  addBubble('Esses são os horários livres. Escolhe um:','bot');
  addChoices(unique.map(t=>({label:t,value:t})),async ch=>{state.selectedTime=ch.value;addBubble(ch.value,'user');await askNotes();});
}

async function askNotes(){
  state.step='askNotes';
  await botTyping('Quase lá! Tem alguma observação? (cor, formato, alergia... ou escreva "pular")');
  input.placeholder='Observação ou "pular"...';
}

async function confirmBooking(){
  addBubble('Perfeito! Vou confirmar seu agendamento...','bot');
  const payload={nome_cliente:state.name,telefone_cliente:state.phone,servico_id:state.selectedService.id,data:state.selectedDate,hora_inicio:state.selectedTime,observacoes:state.notes,email:state.email||null};
  try{
    const res=await api('/api/agendamentos',{method:'POST',body:JSON.stringify(payload)});
    const d=res.data;
    $('modalDetails').innerHTML=`<strong>Serviço:</strong> ${esc(d?.nome_servico||state.selectedService.nome)}<br><strong>Data:</strong> ${formatDate(d?.data||state.selectedDate)}<br><strong>Horário:</strong> ${esc((d?.hora_inicio||state.selectedTime).slice(0,5))} - ${esc((d?.hora_fim||'').slice(0,5))}<br><strong>Valor:</strong> ${money(d?.preco||state.selectedService.preco)}<br><strong>Cliente:</strong> ${esc(state.name)}`;
    $('successModal').classList.add('show');
  }catch(err){await botTyping('Ops! '+err.message+' Tenta outro horário?');await askTime();}
}

$('sendBtn').onclick=handleInput;
$('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')handleInput();});
init();
})();
</script>
</body>
</html>
