<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taiany Trindade | Agendamento</title>
<style>
:root{--pink:#bd7896;--ink:#34262d;--muted:#887780;--line:#f0e1e8;--cream:#fffaf8;--copper:#9b5c43}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif}
.topbar{padding:14px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:center;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:72px;height:72px;border-radius:14px;background:var(--pink);display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px}
.chat-wrap{width:min(calc(100% - 16px),740px);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.progress{height:4px;background:var(--line);border-radius:99px;margin:10px 0;overflow:hidden}.progress i{display:block;height:100%;background:var(--pink);width:0;transition:.3s}
.chat{flex:1;padding:16px 6px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.bubble{max-width:85%;padding:14px 16px;border-radius:20px;font-size:14.5px;line-height:1.5;animation:pop .18s}
.bubble.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.bubble.user{background:var(--pink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.quick{display:flex;gap:8px;flex-wrap:wrap}.qbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer}.qbtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer}.chip.sel{background:var(--copper);color:#fff;border-color:var(--copper)}
.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13px}
.inputbar{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid var(--line);position:sticky;bottom:0}.inputbar input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px}.inputbar button{border:0;background:var(--pink);color:#fff;border-radius:999px;padding:0 18px;font-weight:800;min-height:44px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}.modal-overlay.show{display:flex}.modal{width:min(100%,480px);background:#fff;border-radius:28px;padding:30px;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="chat-wrap"><div class="topbar"><div class="brand"><div class="brand-mark">TT</div><div><div style="font-family:Georgia,serif">Taiany Trindade</div><div style="font-size:10px;letter-spacing:2px;color:var(--muted)">Nail Designer • Online</div></div></div></div><div class="progress"><i id="progress"></i></div><div id="chat" class="chat"></div><form id="inputForm" class="inputbar"><input id="input" placeholder="Digite aqui..."><button id="send" type="submit">Enviar</button></form></div>
<div id="successModal" class="modal-overlay"><div class="modal"><h2>Agendamento Confirmado!</h2><div id="modalDetails" class="summary" style="text-align:left;margin:14px 0"></div><button id="closeModal" style="width:100%;height:50px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:800">Fechar</button></div></div>
<script>
const $=id=>document.getElementById(id);
const chat=$('chat'), input=$('input'), send=$('send'), progress=$('progress');
let S={services:[],avail:[],service:null,date:null,time:null,name:'',phone:'',email:'',notes:'',step:'start'};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const digits=v=>String(v).replace(/\D/g,'');
const dateBR=i=>{const p=i.split('-');return `${p[2]}/${p[1]}/${p[0]}`};
const mins=v=>{const [h,m]=v.split(':').map(Number);return h*60+m;};
async function api(u,o={}){const h={'Content-Type':'application/json',...(o.headers||{})};const r=await fetch(u,{...o,headers:h,body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false) throw new Error(j.error||'Erro');return j;}
function bubble(t,type='bot'){const d=document.createElement('div');d.className='bubble '+type;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function quickBtns(items,cb){const w=document.createElement('div');w.className='quick';items.forEach(it=>{const b=document.createElement('button');b.className='qbtn '+(it.primary?'primary':'');b.textContent=it.label;b.onclick=()=>{bubble(it.label,'user');w.remove();cb(it);};w.appendChild(b);});chat.appendChild(w);chat.scrollTop=chat.scrollHeight;}
function setProgress(v){progress.style.width=v+'%';}

async function start(){
  S={services:[],avail:[],service:null,date:null,time:null,name:'',phone:'',email:'',notes:'',step:'start'};
  bubble('Olá! Eu sou a secretária virtual da Taiany 💅');
  setTimeout(()=>bubble('Você já tem cadastro aqui no studio?'),400);
  quickBtns([{label:'✅ Já tenho cadastro',value:'has'},{label:'📝 Não tenho, quero me cadastrar',value:'no',primary:true},{label:'📅 Ver meus horários',value:'my'}],handleFirst);
  setProgress(10);
  const s=await api('/api/servicos'); S.services=s.data||s;
  const a=await api('/api/disponibilidade'); S.avail=a.data||a;
}
function handleFirst(c){
  if(c.value==='has'){ S.step='loginPhone'; bubble('Perfeito! Me informe seu WhatsApp com DDD para eu te encontrar.'); input.placeholder='(00) 00000-0000'; input.focus(); setProgress(25);}
  if(c.value==='no'){ S.step='regName'; bubble('Vamos fazer seu cadastro rapidinho! Qual seu nome completo?'); input.placeholder='Seu nome completo'; input.focus(); setProgress(25);}
  if(c.value==='my'){ S.step='myPhone'; bubble('Me informe seu WhatsApp com DDD que eu puxo todos os seus horários.'); input.placeholder='(00) 00000-0000'; input.focus();}
}

async function handleInput(){
  const v=input.value.trim(); if(!v) return; bubble(v,'user'); input.value='';
  try{
    if(S.step==='loginPhone'){
      const tel=digits(v); if(tel.length<10){bubble('WhatsApp incompleto. Ex: 17 99123-4567');return;}
      const res=await api('/api/cliente?telefone='+tel);
      if(!res.existe){bubble('Não achei cadastro com esse WhatsApp. Quer se cadastrar agora?'); quickBtns([{label:'Sim, cadastrar',value:'yes',primary:true},{label:'Tentar outro número',value:'no'}],c=>{if(c.value==='yes'){S.step='regName';bubble('Qual seu nome completo?');} else {S.step='loginPhone';bubble('Me informe o WhatsApp correto.');}}); return;}
      S.name=res.data.nome; S.phone=tel; S.email=res.data.email||''; bubble(`Achei você, ${S.name}! 💖 Vamos agendar?`); showServices();
    }
    else if(S.step==='myPhone'){
      const tel=digits(v);
      const res=await api('/api/meus-agendamentos?telefone='+tel);
      const list=res.data||[];
      if(!list.length){bubble('Não encontrei agendamentos com esse WhatsApp.'); quickBtns([{label:'Quero agendar',value:'book',primary:true}],()=>handleFirst({value:'has'})); return;}
      bubble(`Encontrei ${list.length} agendamento(s):`);
      list.forEach(a=>{const d=document.createElement('div');d.className='summary';d.innerHTML=`<b>${esc(a.nome_servico)}</b><br>📅 ${dateBR(a.data)} às ${a.hora_inicio.slice(0,5)}<br><small>Status: ${a.status}</small>`;chat.appendChild(d);});
      bubble('Quer fazer um novo agendamento?'); quickBtns([{label:'Sim, agendar',value:'book',primary:true}],()=>{S.step='loginPhone'; bubble('Confirme seu WhatsApp para continuar.');});
    }
    else if(S.step==='regName'){ S.name=v; S.step='regPhone'; bubble('Agora me informe seu WhatsApp com DDD. Ele será seu login.'); input.placeholder='(00) 00000-0000'; setProgress(40);}
    else if(S.step==='regPhone'){
      const tel=digits(v); if(tel.length<10){bubble('WhatsApp inválido.');return;}
      // verifica se já existe
      const check=await api('/api/cliente?telefone='+tel);
      if(check.existe){bubble('⚠️ Já existe cadastro com esse WhatsApp! Vou te logar com ele.'); S.phone=tel; S.name=check.data.nome; showServices(); return;}
      S.phone=tel; S.step='regEmail'; bubble('Qual seu e-mail? Se não quiser, escreva "pular".'); input.placeholder='E-mail ou pular'; setProgress(55);
    }
    else if(S.step==='regEmail'){
      S.email=v.toLowerCase()==='pular'?'':v;
      // CADASTRA DE VERDADE NO SUPABASE
      await api('/api/clientes',{method:'POST',body:{nome:S.name,telefone:S.phone,email:S.email}});
      bubble(`Cadastro criado com sucesso, ${S.name}! Agora vamos agendar.`);
      showServices();
    }
    else if(S.step==='notes'){ S.notes=v.toLowerCase()==='pular'?'':v; confirmBooking(); }
  }catch(e){ bubble(e.message); }
}

function showServices(){
  S.step='service'; setProgress(70); bubble('Qual serviço você quer?');
  const wrap=document.createElement('div');wrap.className='cards';
  S.services.forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<b>${esc(s.nome)}</b><br><small>${esc(s.descricao||'')}</small><div style="color:#bd7896;font-weight:800;margin-top:6px">${money(s.preco)} • ${s.duracao_minutos}min</div>`;b.onclick=()=>{S.service=s;bubble(s.nome,'user');wrap.remove();askDate();};wrap.appendChild(b);});
  chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;
}
async function askDate(){
  bubble('Buscando datas livres...');
  const dates=[];
  for(let i=0;i<=60;i++){
    const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);
    const iso=d.toISOString().slice(0,10);
    try{const r=await api(`/api/horarios?data=${iso}&servico_id=${S.service.id}`); if((r.data||r).length>0) dates.push(iso);}catch{}
    if(dates.length>=12) break;
  }
  if(!dates.length){bubble('Sem datas livres.');return;}
  const chips=document.createElement('div');chips.className='chips';
  dates.forEach(iso=>{const b=document.createElement('button');b.className='chip';const dt=new Date(iso+'T12:00:00');b.textContent=dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});b.onclick=()=>{S.date=iso;bubble(dateBR(iso),'user');chips.remove();askTime();};chips.appendChild(b);});
  chat.appendChild(chips);
}
async function askTime(){
  const r=await api(`/api/horarios?data=${S.date}&servico_id=${S.service.id}`);
  const list=r.data||r;
  if(!list.length){bubble('Essa data lotou, escolha outra.');askDate();return;}
  bubble('Escolha um horário:'); const chips=document.createElement('div');chips.className='chips';
  list.forEach(h=>{const b=document.createElement('button');b.className='chip';b.textContent=h;b.onclick=()=>{S.time=h;bubble(h,'user');chips.remove();askNotes();};chips.appendChild(b);});
  chat.appendChild(chips);
}
function askNotes(){S.step='notes'; setProgress(90); bubble('Alguma observação? Cor, formato... Se não, escreva "pular".'); input.placeholder='Observação ou pular';}
async function confirmBooking(){
  const payload={nome_cliente:S.name,telefone_cliente:S.phone,servico_id:S.service.id,data:S.date,hora_inicio:S.time,observacoes:S.notes,email:S.email};
  const res=await api('/api/agendamentos',{method:'POST',body:payload});
  const ap=res.data; $('modalDetails').innerHTML=`<b>${esc(ap.nome_servico)}</b><br>📅 ${dateBR(ap.data)} às ${ap.hora_inicio.slice(0,5)}<br>💰 ${money(ap.preco)}<br>👤 ${esc(S.name)}<br>📱 ${esc(S.phone)}`;
  $('successModal').classList.add('show'); setProgress(100);
}
$('inputForm').addEventListener('submit',e=>{e.preventDefault();handleInput();});
$('closeModal').addEventListener('click',()=>{$('successModal').classList.remove('show');chat.innerHTML='';start();});
start();
</script>
</body>
</html>
