
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f3">
  <title>Taiany Trindade | Acesso</title>

  <style>
    :root {
      --bg: #fbf7f3;
      --white: #fffdfb;
      --rose: #b96f82;
      --rose-dark: #9e566b;
      --gold: #c6a15b;
      --ink: #34242a;
      --muted: #89777c;
      --line: #eadde0;
      --danger: #a64252;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 10%, #f4dce180, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #f4e8c966, transparent 38%),
        var(--bg);
      font-family: Inter, "Segoe UI", system-ui, Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .owner-logo {
      width: 190px;
      height: 190px;
      display: grid;
      place-items: center;
      padding: 5px;
      overflow: hidden;
      border: 1px solid var(--gold);
      border-radius: 24px;
      background: linear-gradient(145deg, #fff, #f4e8c9);
      box-shadow: 0 12px 36px #9b70401c;
    }

    .owner-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
    }

    .login-card {
      width: 100%;
      margin-top: 28px;
      padding: 28px;
      border: 1px solid #eadde0c9;
      border-radius: 20px;
      background: #fffdfbeF;
      box-shadow: 0 18px 55px #5e35410d;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #655058;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: white;
      font: inherit;
      font-size: 13px;
    }

    input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px #b96f821c;
    }

    input::placeholder {
      color: #b2a2a6;
    }

    .toggle {
      position: absolute;
      top: 50%;
      right: 7px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .toggle svg {
      width: 19px;
      height: 19px;
    }

    .submit {
      width: 100%;
      min-height: 48px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: linear-gradient(110deg, #bd7788, #9e566b);
      box-shadow: 0 7px 18px #a95e7226;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      cursor: pointer;
    }

    .submit:hover:not(:disabled) {
      filter: brightness(.97);
    }

    .submit:disabled {
      opacity: .65;
      cursor: wait;
    }

    .message {
      min-height: 18px;
      margin: 12px 0 0;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error { color: var(--danger); }
    .message.ok { color: #34775d; }

    .developer {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
    }

    .developer-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      text-align: right;
    }

    .developer-label strong {
      display: block;
      color: var(--gold-dark, #92713a);
      font-size: 10px;
      letter-spacing: .5px;
    }

    .developer-logo {
      width: 76px;
      height: 76px;
      padding: 3px;
      overflow: hidden;
      border: 1px solid var(--gold);
      border-radius: 14px;
      background: white;
    }

    .developer-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 10px;
    }

    @media (max-width: 380px) {
      .owner-logo {
        width: 155px;
        height: 155px;
      }

      .login-card {
        padding: 22px 19px;
      }

      .developer-logo {
        width: 65px;
        height: 65px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="owner-logo">
      <img src="/logo.png" alt="Taiany Trindade"
           onerror="this.style.visibility='hidden'">
    </div>

    <form class="login-card" id="loginForm">
      <div class="field">
        <label for="user">Usuário</label>
        <input
          id="user"
          name="username"
          type="text"
          placeholder="Digite seu usuário"
          autocomplete="username"
          autocapitalize="none"
          required
        >
      </div>

      <div class="field">
        <label for="pass">Senha</label>
        <div class="input-wrap">
          <input
            id="pass"
            name="password"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >

          <button class="toggle" id="togglePassword" type="button"
                  aria-label="Mostrar senha">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="submit" id="loginBtn" type="submit">
        <span id="loginBtnText">Entrar</span>
        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <p class="message" id="msg" role="status"
         aria-live="polite"></p>
    </form>

    <footer class="developer">
      <div class="developer-label">
        Desenvolvido por
        <strong>Tecnologia &amp; Soluções</strong>
      </div>

      <div class="developer-logo">
        <img src="/logo-desenvolvimento.png"
             alt="Logo da empresa desenvolvedora"
             onerror="this.style.visibility='hidden'">
      </div>
    </footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    const form = $('loginForm');
    const button = $('loginBtn');
    const buttonText = $('loginBtnText');
    const message = $('msg');

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    $('togglePassword').addEventListener('click', () => {
      const password = $('pass');
      const showing = password.type === 'password';

      password.type = showing ? 'text' : 'password';
      $('togglePassword').setAttribute(
        'aria-label',
        showing ? 'Ocultar senha' : 'Mostrar senha'
      );

      $('eyeIcon').innerHTML = showing
        ? '<path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-4 4.8"/><path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>'
        : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const user = $('user').value.trim();
      const pass = $('pass').value;

      if (!user || !pass) {
        showMessage('Informe o usuário e a senha.');
        return;
      }

      button.disabled = true;
      buttonText.textContent = 'Verificando...';
      showMessage('');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ user, pass })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.ok) {
          throw new Error(
            result.error || 'Usuário ou senha incorretos.'
          );
        }

        showMessage('Acesso autorizado.', 'ok');

        // Destino fixo: página administrativa na raiz do site.
        window.location.replace('/taiany-painel-admin.html');

      } catch (error) {
        showMessage(
          error.message || 'Falha de conexão. Tente novamente.'
        );
        button.disabled = false;
        buttonText.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
